<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ficha de Operações - Forças Táticas</title>
    <!-- Incluindo html2pdf para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #3a3e3f;
            font-family: 'Courier New', 'Consolas', 'Monaco', monospace;
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTAINER PRINCIPAL - COMPACTADO PARA CABER EXATAMENTE EM UMA PÁGINA A4 */
        .sheet {
            max-width: 850px;
            width: 100%;
            background: #e8e3d5;
            border: 2px solid #5a4a2e;
            box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.2);
            padding: 8px 12px 12px;
            position: relative;
        }

        /* TOPO */
        .military-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #4a3a28;
            padding-bottom: 4px;
            margin-bottom: 6px;
            gap: 6px;
        }

        .title-section {
            flex: 2;
        }

        .title-section h1 {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #2b4a2f;
            margin: 0 0 1px 0;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            border-left: 4px solid #6b4c2c;
            padding-left: 8px;
        }

        .title-section .sub {
            font-size: 0.55rem;
            color: #4a3a2a;
            text-transform: uppercase;
        }

        /* IMAGEM - TAMANHO MÍNIMO */
        .image-slot {
            background: #bcb09b;
            border: 2px solid #4a3a28;
            width: 85px;
            min-width: 85px;
            height: 95px;
            display: flex;
            flex-direction: column;
            background-color: #d8ceb4;
            overflow: hidden;
        }

        .image-preview-container {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #a89b7a;
            overflow: hidden;
            cursor: pointer;
        }

        .image-preview-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-preview-container .no-image {
            color: #4a3e2a;
            font-size: 0.45rem;
            text-align: center;
            padding: 2px;
        }

        .image-input-area {
            padding: 2px 3px;
            width: 100%;
        }

        .image-input-area input[type="file"] {
            width: 100%;
            background: #fffcf0;
            border: 1px solid #7c6846;
            font-size: 0.4rem;
            padding: 1px;
        }

        .image-buttons {
            display: flex;
            gap: 2px;
            margin-top: 2px;
            justify-content: center;
        }

        .image-buttons button {
            background: #5e4b30;
            border: none;
            color: #efe3cd;
            font-size: 0.4rem;
            padding: 1px 2px;
            cursor: pointer;
            box-shadow: none;
        }

        /* INFORMAÇÕES BÁSICAS */
        .info-bar {
            background: #d6cdb2;
            border: 1px solid #8b7a5b;
            padding: 3px 6px;
            margin-bottom: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: space-between;
        }

        .info-item {
            display: flex;
            align-items: baseline;
            gap: 3px;
        }

        .info-item label {
            font-size: 0.5rem;
            text-transform: uppercase;
            background: #5e4b30;
            color: #efe3cd;
            padding: 1px 3px;
        }

        .info-item input {
            background: #fffef5;
            border: 1px solid #7a6442;
            padding: 1px 3px;
            font-family: monospace;
            width: 100px;
            font-size: 0.55rem;
        }

        /* ESTATÍSTICAS */
        .stats-grid {
            background: #dbd0b5;
            padding: 4px 6px;
            margin: 5px 0;
            border: 1px solid #8f7b56;
            border-left: 4px solid #556b2f;
        }

        .stats-title {
            font-weight: 900;
            font-size: 0.65rem;
            margin-bottom: 4px;
            border-bottom: 1px solid #8b744c;
            display: inline-block;
            padding-right: 8px;
        }

        .row-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }

        .stat {
            background: #f2ebd5;
            padding: 1px 4px;
            display: flex;
            align-items: center;
            gap: 3px;
            border: 1px solid #aa946b;
        }

        .stat label {
            font-size: 0.5rem;
            font-weight: 800;
        }

        .stat input {
            background: white;
            border: 1px solid #7e6843;
            padding: 1px 2px;
            width: 55px;
            font-size: 0.55rem;
        }

        .slash-group {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .slash-group input {
            width: 38px;
        }

        /* BLOCOS */
        .military-block {
            background: #e2d9c2;
            margin: 5px 0;
            padding: 2px 6px 4px;
            border: 1px solid #a48e64;
        }

        .block-title {
            background: #5f4c30;
            display: inline-block;
            padding: 1px 10px;
            color: #ffe5bf;
            font-size: 0.55rem;
            margin-top: -7px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .inventario-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-line {
            background: #f6efde;
            padding: 1px 4px;
            border-left: 3px solid #6f4f2c;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .item-line strong {
            min-width: 18px;
            font-size: 0.65rem;
        }

        .item-line input {
            flex: 1;
            background: #fffef5;
            border: 1px solid #b7a06e;
            padding: 1px 4px;
            font-size: 0.55rem;
        }

        textarea {
            width: 100%;
            background: #fffcf0;
            border: 1px solid #9f8960;
            padding: 2px 4px;
            font-size: 0.55rem;
            margin-top: 2px;
            resize: none;
        }

        .habilidades-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .hab-item {
            background: #f2ead7;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 1px 4px;
            border-bottom: 1px solid #cfbc93;
        }

        .hab-num {
            font-weight: 900;
            min-width: 22px;
            font-size: 0.65rem;
        }

        .hab-item input {
            flex: 1;
            background: #fffcf3;
            border: 1px solid #b49966;
            padding: 1px 4px;
            font-size: 0.55rem;
        }

        /* MISSÃO */
        .missao-box {
            background: #cbc09e;
            border-left: 4px solid #425c2c;
            padding: 3px 6px;
            margin: 5px 0;
        }

        .missao-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            margin-bottom: 2px;
        }

        .missao-row strong {
            font-size: 0.55rem;
        }

        .missao-row input {
            background: #fff3e0;
            border: 1px solid #a48149;
            padding: 1px 3px;
            font-size: 0.55rem;
        }

        /* BOTÕES - OCULTOS NO PDF */
        .action-bar {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 10px 0 4px;
            flex-wrap: wrap;
        }

        button {
            background: #2e3820;
            border: none;
            color: #efe1c1;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            padding: 3px 12px;
            font-size: 0.55rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 2px 2px 0 #12140c;
        }

        button:hover {
            background: #4f6236;
            transform: translate(-1px, -1px);
        }

        .reset-btn { background: #5c432a; }
        .export-txt-btn { background: #2c5a3b; }
        .archive-btn { background: #3a4a6e; }

        footer {
            font-size: 0.4rem;
            text-align: center;
            margin-top: 5px;
            color: #5a4c32;
            border-top: 1px dotted #bba16d;
            padding-top: 3px;
        }

        /* ESTILOS PARA IMPRESSÃO/PDF - GARANTE PÁGINA ÚNICA */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .sheet {
                box-shadow: none;
                border: 1px solid #aaa;
                margin: 0 auto;
                padding: 6px;
                max-width: 100%;
                page-break-after: avoid;
                page-break-before: avoid;
                page-break-inside: avoid;
                break-inside: avoid;
                overflow: visible;
            }
            .action-bar, footer, .image-buttons, .image-input-area input[type="file"] {
                display: none;
            }
            * {
                break-inside: avoid;
                page-break-inside: avoid;
                break-before: avoid;
                break-after: avoid;
            }
        }
    </style>
</head>
<body>
<div class="sheet" id="fichaContainer">
    <!-- CABEÇALHO -->
    <div class="military-header">
        <div class="title-section">
            <h1>FICHA DE OPERAÇÕES<br>COMANDO TÁTICO</h1>
            <div class="sub">DOCUMENTO CLASSIFICADO // LIVRO DE CAMPO</div>
        </div>
        <div class="image-slot">
            <div class="image-preview-container" id="imagePreviewContainer">
                <div class="no-image" id="noImageText">SEM IMAGEM<br>CLIQUE</div>
                <img id="previewImage" style="display: none;" alt="Preview">
            </div>
            <div class="image-input-area">
                <input type="file" id="imageUploadInput" accept="image/*" style="display: none;">
                <div class="image-buttons">
                    <button id="selectImageBtn" type="button">SEL</button>
                    <button id="clearImageBtn" type="button">LIMPAR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- INFORMAÇÕES BÁSICAS -->
    <div class="info-bar">
        <div class="info-item"><label>UNIDADE</label> <input type="text" id="unidadeField" value="FORCA ALFA"></div>
        <div class="info-item"><label>CODINOME</label> <input type="text" id="nomePersonagem" value="COMANDO FANTASMA"></div>
        <div class="info-item"><label>ID</label> <input type="text" id="arquivoID" value="FT-210"></div>
        <div class="info-item"><label>PATENTE</label> <input type="text" id="patente" value="SARGENTO"></div>
    </div>

    <!-- ESTATÍSTICAS -->
    <div class="stats-grid">
        <div class="stats-title">ESTATISTICA DE CAMPO</div>
        <div class="row-stats">
            <div class="stat"><label>VIDA:</label> <input type="text" id="vida" value="32/32"></div>
            <div class="stat"><label>DEF.BAL:</label> <input type="text" id="defB" value="16"></div>
            <div class="stat"><label>DEF.EXP:</label> <input type="text" id="defE" value="14"></div>
            <div class="stat"><label>MUNICAO:</label> <input type="text" id="municao" value="90/120"></div>
            <div class="stat"><label>MOV:</label> <div class="slash-group"><input type="text" id="mov1" value="8m">/<input type="text" id="mov2" value="12m"></div></div>
        </div>
    </div>

    <!-- INVENTÁRIO -->
    <div class="military-block">
        <div class="block-title">INVENTARIO</div>
        <div class="inventario-row">
            <div class="item-line"><strong>1.</strong> <input type="text" id="inv1" value="Fuzil M4 + carregador"></div>
            <div class="item-line"><strong>2.</strong> <input type="text" id="inv2" value="Granada frag x2"></div>
            <div class="item-line"><strong>3.</strong> <input type="text" id="inv3" value="Kit medico tatico"></div>
            <div class="item-line"><strong>4.</strong> <input type="text" id="inv4" value="Radio / sinalizador"></div>
        </div>
        <textarea id="inventarioExtra" rows="1">C4 (1kg), Oculos noturno, coldre</textarea>
    </div>

    <!-- HABILIDADES -->
    <div class="military-block">
        <div class="block-title">HABILIDADES</div>
        <div class="habilidades-list">
            <div class="hab-item"><span class="hab-num">1.</span> <input type="text" id="hab1" value="Tiro de precisao avancado"></div>
            <div class="hab-item"><span class="hab-num">2.</span> <input type="text" id="hab2" value="Especialista em demolicoes"></div>
            <div class="hab-item"><span class="hab-num">3.</span> <input type="text" id="hab3" value="Movimento furtivo"></div>
            <div class="hab-item"><span class="hab-num">4.</span> <input type="text" id="hab4" value="Lideranca em combate"></div>
        </div>
        <textarea id="obsHabilidades" rows="1">CQB, sobrevivencia em selva</textarea>
    </div>

    <!-- MISSÃO -->
    <div class="missao-box">
        <div class="missao-row">
            <strong>MISSAO:</strong> <input type="text" id="infoExtra" style="width: 200px;" value="OP: TERRA QUEIMADA">
            <strong>DATA:</strong> <input type="text" id="dataMissao" style="width: 80px;" value="16/05/2026">
        </div>
        <div class="missao-row" style="margin-top: 2px;">
            <strong style="width: auto;">NOTAS:</strong> <input type="text" id="notasPlano" style="flex:1;" value="Extracao zona norte - codigo vermelho">
        </div>
    </div>

    <!-- BOTÕES -->
    <div class="action-bar">
        <button id="resetBtn" class="reset-btn">LIMPAR</button>
        <button id="exportTxtBtn" class="export-txt-btn">EXPORTAR TXT</button>
        <button id="archiveBtn" class="archive-btn">PDF UNICO</button>
    </div>
    <footer>DOCUMENTO OPERACIONAL - EDICAO LIVRE</footer>
</div>

<script>
    // Lista de campos
    const fieldIds = [
        'unidadeField', 'vida', 'defB', 'defE', 'municao', 'mov1', 'mov2',
        'inv1', 'inv2', 'inv3', 'inv4', 'inventarioExtra',
        'hab1', 'hab2', 'hab3', 'hab4', 'obsHabilidades',
        'nomePersonagem', 'arquivoID', 'patente', 'infoExtra', 'dataMissao', 'notasPlano'
    ];
    
    // Elementos de imagem
    const previewImage = document.getElementById('previewImage');
    const noImageText = document.getElementById('noImageText');
    const imageUploadInput = document.getElementById('imageUploadInput');
    let currentImageBase64 = null;

    function handleImageUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            currentImageBase64 = e.target.result;
            previewImage.src = currentImageBase64;
            previewImage.style.display = 'block';
            noImageText.style.display = 'none';
            saveToLocalStorage();
            showToast("IMAGEM CARREGADA");
        };
        reader.onerror = () => showToast("ERRO");
        reader.readAsDataURL(file);
    }

    function clearImage() {
        currentImageBase64 = null;
        previewImage.src = '';
        previewImage.style.display = 'none';
        noImageText.style.display = 'flex';
        noImageText.innerHTML = 'SEM IMAGEM<br>CLIQUE';
        if (imageUploadInput) imageUploadInput.value = '';
        saveToLocalStorage();
        showToast("IMAGEM REMOVIDA");
    }

    function openFileSelector() { imageUploadInput?.click(); }
    
    function saveToLocalStorage() {
        const data = {};
        fieldIds.forEach(id => { const el = document.getElementById(id); if(el) data[id] = el.value; });
        data.imageBase64 = currentImageBase64;
        localStorage.setItem('fichaMilitarData', JSON.stringify(data));
    }

    function showToast(msg) {
        let toast = document.getElementById('militaryToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'militaryToast';
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#2b2a25';
            toast.style.color = '#dad2b0';
            toast.style.padding = '3px 10px';
            toast.style.fontFamily = 'monospace';
            toast.style.fontSize = '0.65rem';
            toast.style.zIndex = '9999';
            document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 1200);
    }

    function loadFromLocalStorage() {
        const saved = localStorage.getItem('fichaMilitarData');
        if (!saved) return false;
        try {
            const data = JSON.parse(saved);
            for (let id in data) {
                if (id === 'imageBase64') {
                    if (data[id]) {
                        currentImageBase64 = data[id];
                        previewImage.src = currentImageBase64;
                        previewImage.style.display = 'block';
                        noImageText.style.display = 'none';
                    }
                } else {
                    const el = document.getElementById(id);
                    if (el && data.hasOwnProperty(id)) el.value = data[id];
                }
            }
            return true;
        } catch(e) { return false; }
    }

    function attachAutoSave() {
        fieldIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', () => saveToLocalStorage());
                el.addEventListener('change', () => saveToLocalStorage());
            }
        });
    }

    function resetAllFields() {
        fieldIds.forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
        clearImage();
        saveToLocalStorage();
        showToast("FICHA LIMPA");
    }

    // FUNÇÃO GERAR PDF - GARANTE PÁGINA ÚNICA
    async function archiveAsPDF() {
        const element = document.getElementById('fichaContainer');
        if (!element) return;
        
        showToast("GERANDO PDF PAGINA UNICA...");
        
        // Configuração otimizada para página única
        const opt = {
            margin:        [0.1, 0.1, 0.1, 0.1],
            filename:     `ficha_operacao_${new Date().getTime()}.pdf`,
            image:        { type: 'jpeg', quality: 0.92 },
            html2canvas:  { 
                scale: 2.2,
                letterRendering: true,
                useCORS: true,
                logging: false,
                backgroundColor: '#e8e3d5',
                windowWidth: element.scrollWidth,
                windowHeight: element.scrollHeight
            },
            jsPDF:        { 
                unit: 'in', 
                format: 'a4', 
                orientation: 'portrait',
                compress: true,
                hotfixes: ['px_scaling']
            },
            pagebreak:    { mode: 'avoid-all' }
        };
        
        try {
            // Forçar estilos para evitar quebra
            const originalStyle = element.style.cssText;
            element.style.pageBreakInside = 'avoid';
            element.style.breakInside = 'avoid';
            element.style.overflow = 'visible';
            element.style.height = 'auto';
            
            await html2pdf().set(opt).from(element).save();
            
            element.style.cssText = originalStyle;
            showToast("PDF DE UMA PAGINA GERADO!");
        } catch (error) {
            console.error("Erro:", error);
            showToast("ERRO AO GERAR PDF");
        }
    }

    function exportAsTxt() {
        let content = "=====================================================\n";
        content += "     RELATORIO OPERACIONAL - FICHA DE CAMPO\n";
        content += "=====================================================\n";
        content += `UNIDADE: ${document.getElementById('unidadeField').value}\n`;
        content += `CODINOME: ${document.getElementById('nomePersonagem').value} | ID: ${document.getElementById('arquivoID').value} | PATENTE: ${document.getElementById('patente').value}\n`;
        content += `DATA: ${document.getElementById('dataMissao').value}\n`;
        content += "\n--- ESTATISTICAS ---\n";
        content += `VIDA: ${document.getElementById('vida').value}\n`;
        content += `DEFESA BAL: ${document.getElementById('defB').value} | DEF EXP: ${document.getElementById('defE').value}\n`;
        content += `MUNICAO: ${document.getElementById('municao').value}\n`;
        content += `MOVIMENTO: ${document.getElementById('mov1').value} / ${document.getElementById('mov2').value}\n`;
        content += "\n--- INVENTARIO ---\n";
        content += `1. ${document.getElementById('inv1').value}\n2. ${document.getElementById('inv2').value}\n3. ${document.getElementById('inv3').value}\n4. ${document.getElementById('inv4').value}\n`;
        content += `EXTRA: ${document.getElementById('inventarioExtra').value}\n`;
        content += "\n--- HABILIDADES ---\n";
        content += `1. ${document.getElementById('hab1').value}\n2. ${document.getElementById('hab2').value}\n3. ${document.getElementById('hab3').value}\n4. ${document.getElementById('hab4').value}\n`;
        content += `OBS: ${document.getElementById('obsHabilidades').value}\n`;
        content += `\n--- MISSAO ---\n`;
        content += `${document.getElementById('infoExtra').value}\n`;
        content += `NOTAS: ${document.getElementById('notasPlano').value}\n`;
        content += `\n[FIM] - ${new Date().toLocaleString()}\n`;
        
        const blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `relatorio_${Date.now()}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast("TXT EXPORTADO");
    }

    // INICIALIZAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
        loadFromLocalStorage();
        attachAutoSave();
        
        if (imageUploadInput) {
            imageUploadInput.addEventListener('change', (e) => {
                if (e.target.files?.[0]) handleImageUpload(e.target.files[0]);
            });
        }
        
        document.getElementById('selectImageBtn')?.addEventListener('click', openFileSelector);
        document.getElementById('clearImageBtn')?.addEventListener('click', clearImage);
        document.getElementById('imagePreviewContainer')?.addEventListener('click', openFileSelector);
        document.getElementById('resetBtn')?.addEventListener('click', resetAllFields);
        document.getElementById('exportTxtBtn')?.addEventListener('click', exportAsTxt);
        document.getElementById('archiveBtn')?.addEventListener('click', archiveAsPDF);
    });
</script>
</body>
</html>
