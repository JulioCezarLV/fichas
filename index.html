<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ficha de Operações - Forças Táticas</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #3a3e3f;
            font-family: 'Courier New', 'Consolas', 'Monaco', monospace;
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* container estilo documento militar */
        .sheet {
            max-width: 1100px;
            width: 100%;
            background: #e8e3d5;
            background-image: none;
            border: 2px solid #5a4a2e;
            box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.2);
            padding: 20px 24px 32px;
            position: relative;
        }

        /* selo / topo militar */
        .military-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid #4a3a28;
            padding-bottom: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-section {
            flex: 2;
        }

        .title-section h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #2b4a2f;
            margin: 0 0 6px 0;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            border-left: 8px solid #6b4c2c;
            padding-left: 14px;
        }

        .title-section .sub {
            font-size: 0.8rem;
            color: #4a3a2a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* SLOT DE IMAGEM MELHORADO */
        .image-slot {
            background: #bcb09b;
            border: 2px solid #4a3a28;
            width: 130px;
            min-width: 130px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.7rem;
            color: #2c2b26;
            font-weight: bold;
            background-color: #d8ceb4;
            box-shadow: inset 0 0 0 1px #f0ecd9, 3px 3px 0 rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .image-preview-container {
            width: 100%;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #a89b7a;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #6b5a3e;
        }

        .image-preview-container img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .image-preview-container .no-image {
            color: #4a3e2a;
            font-size: 0.65rem;
            text-align: center;
            padding: 8px;
        }

        .image-input-area {
            padding: 6px 8px;
            width: 100%;
        }

        .image-input-area input {
            width: 100%;
            background: #fffcf0;
            border: 1px solid #7c6846;
            font-family: monospace;
            font-size: 0.65rem;
            padding: 4px;
            text-align: center;
        }

        .image-buttons {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            justify-content: center;
        }

        .image-buttons button {
            background: #5e4b30;
            border: none;
            color: #efe3cd;
            font-family: monospace;
            font-size: 0.6rem;
            padding: 2px 6px;
            cursor: pointer;
            box-shadow: none;
            text-transform: none;
            letter-spacing: 0;
        }

        .image-buttons button:hover {
            background: #7a6240;
            transform: none;
        }

        /* blocos de informações */
        .info-bar {
            background: #d6cdb2;
            border: 1px solid #8b7a5b;
            padding: 12px 18px;
            margin-bottom: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            font-weight: bold;
        }

        .info-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .info-item label {
            font-size: 0.75rem;
            text-transform: uppercase;
            background: #5e4b30;
            color: #efe3cd;
            padding: 2px 10px;
            letter-spacing: 1px;
        }

        .info-item input {
            background: #fffef5;
            border: 1px solid #7a6442;
            padding: 5px 8px;
            font-family: monospace;
            font-weight: bold;
            width: 160px;
        }

        /* estatísticas campo */
        .stats-grid {
            background: #dbd0b5;
            padding: 16px 20px;
            margin: 20px 0;
            border: 1px solid #8f7b56;
            border-left: 8px solid #556b2f;
        }

        .stats-title {
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-bottom: 1px solid #8b744c;
            display: inline-block;
            padding-right: 20px;
        }

        .row-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 30px;
        }

        .stat {
            background: #f2ebd5;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border: 1px solid #aa946b;
        }

        .stat label {
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .stat input {
            background: white;
            border: 1px solid #7e6843;
            padding: 5px 8px;
            width: 100px;
            font-family: monospace;
            font-weight: bold;
        }

        .slash-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .slash-group input {
            width: 70px;
            text-align: center;
        }

        /* inventário e habilidades */
        .military-block {
            background: #e2d9c2;
            margin: 26px 0;
            padding: 8px 18px 18px;
            border: 1px solid #a48e64;
            position: relative;
        }

        .block-title {
            background: #5f4c30;
            display: inline-block;
            padding: 4px 24px;
            color: #ffe5bf;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 0.9rem;
            margin-top: -14px;
            margin-bottom: 18px;
            text-transform: uppercase;
            border-radius: 0px;
        }

        .inventario-row {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .item-line {
            background: #f6efde;
            padding: 6px 12px;
            border-left: 5px solid #6f4f2c;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-line strong {
            min-width: 28px;
            font-size: 1rem;
        }

        .item-line input {
            flex: 1;
            background: #fffef5;
            border: 1px solid #b7a06e;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        textarea {
            width: 100%;
            background: #fffcf0;
            border: 1px solid #9f8960;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            margin-top: 10px;
            resize: vertical;
        }

        .habilidades-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .hab-item {
            background: #f2ead7;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 12px;
            border-bottom: 1px solid #cfbc93;
        }

        .hab-num {
            font-weight: 900;
            min-width: 40px;
            font-size: 1.2rem;
        }

        .hab-item input {
            flex: 1;
            background: #fffcf3;
            border: 1px solid #b49966;
            padding: 8px 10px;
            font-family: monospace;
            font-weight: bold;
        }

        /* botões militares */
        .action-bar {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 28px 0 12px;
            flex-wrap: wrap;
        }

        button {
            background: #2e3820;
            border: none;
            color: #efe1c1;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            padding: 8px 24px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.05s linear;
            border-radius: 0px;
            box-shadow: 3px 3px 0 #12140c;
        }

        button:hover {
            background: #4f6236;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #12140c;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #12140c;
        }

        .reset-btn {
            background: #5c432a;
        }

        .export-txt-btn {
            background: #2c5a3b;
        }

        footer {
            font-size: 0.65rem;
            text-align: center;
            margin-top: 20px;
            color: #5a4c32;
            border-top: 1px dotted #bba16d;
            padding-top: 12px;
            text-transform: uppercase;
        }

        input, textarea, button {
            outline: none;
        }

        @media (max-width: 700px) {
            .sheet {
                padding: 16px;
            }
            .image-slot {
                width: 110px;
                min-width: 110px;
                height: 130px;
            }
            .image-preview-container {
                height: 80px;
            }
        }
    </style>
</head>
<body>
<div class="sheet">
    <!-- cabeçalho com espaço para IMAGEM (canto superior direito) - VERSÃO MELHORADA -->
    <div class="military-header">
        <div class="title-section">
            <h1>FICHA DE OPERAÇÕES<br> COMANDO TÁTICO</h1>
            <div class="sub">DOCUMENTO CLASSIFICADO // LIVRO DE CAMPO</div>
        </div>
        <div class="image-slot" id="imageSlot">
            <div class="image-preview-container" id="imagePreviewContainer">
                <div class="no-image" id="noImageText">SEM IMAGEM</div>
                <img id="previewImage" style="display: none;" alt="Preview">
            </div>
            <div class="image-input-area">
                <input type="text" id="imageUrlInput" placeholder="URL da imagem (jpg, png, gif)">
                <div class="image-buttons">
                    <button id="uploadImageBtn" type="button">CARREGAR URL</button>
                    <button id="clearImageBtn" type="button">LIMPAR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- INFORMAÇÕES BÁSICAS (estilo militar) -->
    <div class="info-bar">
        <div class="info-item"><label>UNIDADE</label> <input type="text" id="unidadeField" placeholder="Ex: 3º Batalhão" value="FORCA ALFA"></div>
        <div class="info-item"><label>CODINOME</label> <input type="text" id="nomePersonagem" placeholder="Operador" value="COMANDO FANTASMA"></div>
        <div class="info-item"><label>ID / ARQUIVO</label> <input type="text" id="arquivoID" placeholder="Nº Registro" value="FT-210"></div>
        <div class="info-item"><label>PATENTE</label> <input type="text" id="patente" placeholder="Graduação" value="SARGENTO"></div>
    </div>

    <!-- ESTATÍSTICA DE CAMPO -->
    <div class="stats-grid">
        <div class="stats-title">ESTATISTICA DE CAMPO</div>
        <div class="row-stats">
            <div class="stat"><label>VIDA (PV):</label> <input type="text" id="vida" value="32 / 32"></div>
            <div class="stat"><label>DEFESA BALISTICA:</label> <input type="text" id="defB" value="16"></div>
            <div class="stat"><label>DEFESA EXPLOSAO:</label> <input type="text" id="defE" value="14"></div>
            <div class="stat"><label>MUNICAO GERAL:</label> <input type="text" id="municao" value="90 / 120"></div>
            <div class="stat"><label>MOVIMENTO:</label> <div class="slash-group"><input type="text" id="mov1" value="8m"> / <input type="text" id="mov2" value="12m"></div></div>
        </div>
    </div>

    <!-- INVENTÁRIO -->
    <div class="military-block">
        <div class="block-title">INVENTARIO DE CAMPO</div>
        <div class="inventario-row">
            <div class="item-line"><strong>1.</strong> <input type="text" id="inv1" value="Fuzil M4 + carregador estendido"></div>
            <div class="item-line"><strong>2.</strong> <input type="text" id="inv2" value="Granada de fragmentacao x2"></div>
            <div class="item-line"><strong>3.</strong> <input type="text" id="inv3" value="Kit medico tatico"></div>
            <div class="item-line"><strong>4.</strong> <input type="text" id="inv4" value="Radio portatil / sinalizador"></div>
        </div>
        <textarea id="inventarioExtra" rows="2" placeholder="Equipamentos secundarios, municao extra, ferramentas...">C4 (1kg), Oculos de visao noturna, coldre de perna</textarea>
    </div>

    <!-- HABILIDADES ESPECIAIS -->
    <div class="military-block">
        <div class="block-title">HABILIDADES OPERACIONAIS</div>
        <div class="habilidades-list">
            <div class="hab-item"><span class="hab-num">1.</span> <input type="text" id="hab1" value="Tiro de precisao avancado"></div>
            <div class="hab-item"><span class="hab-num">2.</span> <input type="text" id="hab2" value="Especialista em demolicoes"></div>
            <div class="hab-item"><span class="hab-num">3.</span> <input type="text" id="hab3" value="Movimento furtivo (camuflagem)"></div>
            <div class="hab-item"><span class="hab-num">4.</span> <input type="text" id="hab4" value="Lideranca tatica + bonus de grupo"></div>
        </div>
        <textarea id="obsHabilidades" rows="2" placeholder="Observacoes taticas / especializacoes adicionais">Treinamento em combate CQB, sobrevivencia em selva.</textarea>
    </div>

    <!-- INFORMAÇÕES ADICIONAIS / MISSÃO ATUAL -->
    <div style="background:#cbc09e; border-left:6px solid #425c2c; padding: 12px 20px; margin: 12px 0;">
        <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between;">
            <div><strong>MISSAO ATUAL:</strong> <input type="text" id="infoExtra" style="background:#fff3e0; border:1px solid #a48149; padding:5px 10px; width: 280px;" value="OPERACAO: TERRA QUEIMADA"></div>
            <div><strong>DATA:</strong> <input type="text" id="dataMissao" placeholder="DD/MM/AAAA" style="background:#fff3e0; border:1px solid #a48149; padding:5px 10px;" value="16/05/2026"></div>
        </div>
        <div style="margin-top: 12px;"><strong>NOTAS DE PLANEJAMENTO:</strong> <input type="text" id="notasPlano" style="width:100%; background:#fffcf0; border:1px solid #af8e58; padding:6px;" value="Ponto de extracao - zona norte. Codigo vermelho."></div>
    </div>

    <div class="action-bar">
        <button id="resetBtn" class="reset-btn">LIMPAR FICHA</button>
        <button id="exportTxtBtn" class="export-txt-btn">EXPORTAR RELATORIO (TXT)</button>
        <button id="fillExampleBtn">CARREGAR PERFIL TATICO</button>
    </div>
    <footer>
        DOCUMENTO OPERACIONAL - EDITAVEL - DADOS SALVOS LOCALMENTE
    </footer>
</div>

<script>
    // lista de campos a serem salvos
    const fieldIds = [
        'unidadeField', 'vida', 'defB', 'defE', 'municao', 'mov1', 'mov2',
        'inv1', 'inv2', 'inv3', 'inv4', 'inventarioExtra',
        'hab1', 'hab2', 'hab3', 'hab4', 'obsHabilidades',
        'nomePersonagem', 'arquivoID', 'patente', 'infoExtra', 'dataMissao', 'notasPlano',
        'imageUrlInput'
    ];

    // elementos da imagem
    const previewImage = document.getElementById('previewImage');
    const noImageText = document.getElementById('noImageText');
    const imageUrlInput = document.getElementById('imageUrlInput');

    // Função para atualizar a imagem com proporções corretas
    function updateImagePreview() {
        const url = imageUrlInput.value.trim();
        
        if (url && (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('data:') || url.startsWith('blob:'))) {
            // Testar se a imagem carrega corretamente
            const img = new Image();
            img.onload = function() {
                previewImage.src = url;
                previewImage.style.display = 'block';
                noImageText.style.display = 'none';
                previewImage.style.objectFit = 'contain';
                previewImage.style.width = '100%';
                previewImage.style.height = '100%';
                saveToLocalStorage();
            };
            img.onerror = function() {
                // Se falhar ao carregar, mostrar mensagem de erro
                previewImage.style.display = 'none';
                noImageText.style.display = 'flex';
                noImageText.innerHTML = 'ERRO: IMAGEM INVALIDA';
                noImageText.style.alignItems = 'center';
                noImageText.style.justifyContent = 'center';
                noImageText.style.height = '100%';
                setTimeout(() => {
                    if (noImageText.innerHTML === 'ERRO: IMAGEM INVALIDA') {
                        noImageText.innerHTML = 'SEM IMAGEM';
                    }
                }, 2000);
                saveToLocalStorage();
            };
            img.src = url;
        } else if (url && url.length > 0) {
            // URL inválida
            previewImage.style.display = 'none';
            noImageText.style.display = 'flex';
            noImageText.innerHTML = 'URL INVALIDA';
            noImageText.style.alignItems = 'center';
            noImageText.style.justifyContent = 'center';
            noImageText.style.height = '100%';
            setTimeout(() => {
                if (noImageText.innerHTML === 'URL INVALIDA') {
                    noImageText.innerHTML = 'SEM IMAGEM';
                }
            }, 2000);
            saveToLocalStorage();
        } else {
            // Sem imagem
            previewImage.style.display = 'none';
            noImageText.style.display = 'flex';
            noImageText.innerHTML = 'SEM IMAGEM';
            noImageText.style.alignItems = 'center';
            noImageText.style.justifyContent = 'center';
            noImageText.style.height = '100%';
            saveToLocalStorage();
        }
    }

    // Função para carregar imagem manualmente pelo botão
    function loadImageFromUrl() {
        const url = imageUrlInput.value.trim();
        if (!url) {
            showToast("INSIRA UMA URL DE IMAGEM");
            return;
        }
        updateImagePreview();
        showToast("CARREGANDO IMAGEM...");
    }

    // Função para limpar a imagem
    function clearImage() {
        imageUrlInput.value = '';
        previewImage.style.display = 'none';
        noImageText.style.display = 'flex';
        noImageText.innerHTML = 'SEM IMAGEM';
        noImageText.style.alignItems = 'center';
        noImageText.style.justifyContent = 'center';
        noImageText.style.height = '100%';
        saveToLocalStorage();
        showToast("IMAGEM REMOVIDA");
    }

    // salvar no localStorage
    function saveToLocalStorage() {
        const data = {};
        for (let id of fieldIds) {
            const el = document.getElementById(id);
            if (el) data[id] = el.value;
        }
        localStorage.setItem('fichaMilitarData', JSON.stringify(data));
        showToast("DADOS SALVOS", 1000);
    }

    function showToast(msg, duration = 1500) {
        let toast = document.getElementById('militaryToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'militaryToast';
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#2b2a25';
            toast.style.color = '#dad2b0';
            toast.style.padding = '6px 18px';
            toast.style.fontFamily = 'monospace';
            toast.style.fontWeight = 'bold';
            toast.style.border = '1px solid #988e6e';
            toast.style.zIndex = '9999';
            toast.style.fontSize = '0.8rem';
            document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, duration);
    }

    function loadFromLocalStorage() {
        const saved = localStorage.getItem('fichaMilitarData');
        if (!saved) return false;
        try {
            const data = JSON.parse(saved);
            for (let id in data) {
                const el = document.getElementById(id);
                if (el && data.hasOwnProperty(id)) {
                    el.value = data[id];
                }
            }
            updateImagePreview();
            return true;
        } catch(e) { return false; }
    }

    // auto-save
    function attachAutoSave() {
        for (let id of fieldIds) {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', () => {
                    saveToLocalStorage();
                });
                el.addEventListener('change', () => {
                    saveToLocalStorage();
                });
            }
        }
        // Evento especial para o campo de URL da imagem
        if (imageUrlInput) {
            imageUrlInput.addEventListener('change', () => {
                updateImagePreview();
            });
        }
    }

    function resetAllFields() {
        document.getElementById('unidadeField').value = '';
        document.getElementById('vida').value = '';
        document.getElementById('defB').value = '';
        document.getElementById('defE').value = '';
        document.getElementById('municao').value = '';
        document.getElementById('mov1').value = '';
        document.getElementById('mov2').value = '';
        document.getElementById('inv1').value = '';
        document.getElementById('inv2').value = '';
        document.getElementById('inv3').value = '';
        document.getElementById('inv4').value = '';
        document.getElementById('inventarioExtra').value = '';
        document.getElementById('hab1').value = '';
        document.getElementById('hab2').value = '';
        document.getElementById('hab3').value = '';
        document.getElementById('hab4').value = '';
        document.getElementById('obsHabilidades').value = '';
        document.getElementById('nomePersonagem').value = '';
        document.getElementById('arquivoID').value = '';
        document.getElementById('patente').value = '';
        document.getElementById('infoExtra').value = '';
        document.getElementById('dataMissao').value = '';
        document.getElementById('notasPlano').value = '';
        clearImage();
        saveToLocalStorage();
        showToast("FICHA LIMPA");
    }

    function loadExampleData() {
        document.getElementById('unidadeField').value = '7º BATALHAO DE FORCAS ESPECIAIS';
        document.getElementById('vida').value = '48 / 48';
        document.getElementById('defB').value = '22';
        document.getElementById('defE').value = '19';
        document.getElementById('municao').value = '210 / 240';
        document.getElementById('mov1').value = '10m';
        document.getElementById('mov2').value = '18m (SPRINT)';
        document.getElementById('inv1').value = 'Fuzil SCAR-H + mira holografica';
        document.getElementById('inv2').value = 'Lanca-granadas M320 (3 granadas)';
        document.getElementById('inv3').value = 'Kit cirurgico avancado + torniquetes';
        document.getElementById('inv4').value = 'Drone de reconhecimento RQ-11';
        document.getElementById('inventarioExtra').value = 'Carga de demolicao (2kg), mina antipessoal, GPS tatico';
        document.getElementById('hab1').value = 'ATIRADOR DE ELITE: precisao em alcance estendido';
        document.getElementById('hab2').value = 'DEMOLICOES: ignora 10 pontos de DEF E';
        document.getElementById('hab3').value = 'INFILTRACAO: movimentacao silenciosa e camuflagem';
        document.getElementById('hab4').value = 'COMANDO DE CAMPO: aliados recebem +1 em testes taticos';
        document.getElementById('obsHabilidades').value = 'Certificacao em resgate em combate (TCCC). Especialista em brechas';
        document.getElementById('nomePersonagem').value = 'CAPITAO HENRIQUE "FANTASMA"';
        document.getElementById('arquivoID').value = 'BR-OP/88-ALPHA';

    // EXPORTAR SOMENTE TXT
    function exportAsTxt() {
        let content = "=====================================================\n";
        content += "     RELATORIO OPERACIONAL - FICHA DE CAMPO\n";
        content += "=====================================================\n";
        content += `UNIDADE: ${document.getElementById('unidadeField').value}\n`;
        content += `CODINOME: ${document.getElementById('nomePersonagem').value} | ID: ${document.getElementById('arquivoID').value} | PATENTE: ${document.getElementById('patente').value}\n`;
        content += `DATA MISSAO: ${document.getElementById('dataMissao').value}\n`;
        content += "\n--- ESTATISTICAS DE COMBATE ---\n";
        content += `VIDA (PV): ${document.getElementById('vida').value}\n`;
        content += `DEFESA BALISTICA: ${document.getElementById('defB').value} | DEFESA EXPLOSAO: ${document.getElementById('defE').value}\n`;
        content += `MUNICAO GERAL: ${document.getElementById('municao').value}\n`;
        content += `MOVIMENTO: ${document.getElementById('mov1').value} / ${document.getElementById('mov2').value}\n`;
        content += "\n--- INVENTARIO ---\n";
        content += `1. ${document.getElementById('inv1').value}\n2. ${document.getElementById('inv2').value}\n3. ${document.getElementById('inv3').value}\n4. ${document.getElementById('inv4').value}\n`;
        content += `EQUIPAMENTOS ADICIONAIS: ${document.getElementById('inventarioExtra').value}\n`;
        content += "\n--- HABILIDADES OPERACIONAIS ---\n";
        content += `1. ${document.getElementById('hab1').value}\n2. ${document.getElementById('hab2').value}\n3. ${document.getElementById('hab3').value}\n4. ${document.getElementById('hab4').value}\n`;
        content += `OBSERVACOES: ${document.getElementById('obsHabilidades').value}\n`;
        content += `\n--- MISSAO E NOTAS ---\n`;
        content += `MISSAO ATUAL: ${document.getElementById('infoExtra').value}\n`;
        content += `NOTAS DE PLANEJAMENTO: ${document.getElementById('notasPlano').value}\n`;
        content += `\n[FIM DO REGISTRO] - ${new Date().toLocaleString()}\n`;
        downloadFile('relatorio_operacao.txt', content);
        showToast("RELATORIO TXT EXPORTADO");
    }

    function downloadFile(filename, text) {
        const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
    }

    // inicialização
    window.addEventListener('DOMContentLoaded', () => {
        const loaded = loadFromLocalStorage();
        if (!loaded) {
            if (!document.getElementById('vida').value) document.getElementById('vida').value = '30 / 30';
            if (!document.getElementById('defB').value) document.getElementById('defB').value = '15';
            if (!document.getElementById('defE').value) document.getElementById('defE').value = '12';
            if (!document.getElementById('mov1').value) document.getElementById('mov1').value = '8m';
            if (!document.getElementById('mov2').value) document.getElementById('mov2').value = '12m';
            saveToLocalStorage();
        }
        attachAutoSave();
        updateImagePreview();

        document.getElementById('resetBtn').addEventListener('click', resetAllFields);
        document.getElementById('exportTxtBtn').addEventListener('click', exportAsTxt);
        document.getElementById('fillExampleBtn').addEventListener('click', loadExampleData);
        document.getElementById('uploadImageBtn').addEventListener('click', loadImageFromUrl);
        document.getElementById('clearImageBtn').addEventListener('click', clearImage);
    });
</script>
