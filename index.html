<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PIXEL XP - Sistema Militar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            font-family: 'Courier New', 'VT323', monospace;
            background: #0a0f0a;
            overflow: hidden;
            height: 100vh;
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a2f1a 0%, #1a4f2a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-container {
            background: #2a4a2a;
            border: 4px solid #8affaa;
            padding: 25px;
            width: 380px;
            box-shadow: 10px 10px 0 #0a1f0a;
            text-align: center;
        }

        .login-container h2 {
            color: #aaffaa;
            text-shadow: 2px 2px 0 #0a3f0a;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .login-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #6aaa4a;
        }

        .tab-btn {
            flex: 1;
            background: #1a3a1a;
            border: none;
            color: #88aa88;
            padding: 8px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
        }

        .tab-btn.active {
            background: #3a7a2a;
            color: #ffffaa;
            border-bottom: 2px solid #aaffaa;
        }

        .login-form, .register-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .login-form input, .register-form input {
            width: 100%;
            padding: 10px;
            background: #1a2a15;
            border: 2px solid #6aaa4a;
            color: #8aff6a;
            font-family: monospace;
            font-size: 14px;
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            background: #3a7a2a;
            color: #ffffaa;
            border: 2px solid #aaffaa;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-container button:hover { background: #5a9a3a; }
        .error-msg { color: #ffaa66; margin-top: 10px; font-size: 11px; }
        .success-msg { color: #aaffaa; margin-top: 10px; font-size: 11px; }

        .desktop {
            display: none;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #1a6a3a 0%, #0a3a1a 100%);
            position: relative;
            overflow: hidden;
        }

        .desktop::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 15% 20%, rgba(200,230,200,0.15) 8px, transparent 8px),
                              radial-gradient(circle at 65% 15%, rgba(180,220,180,0.12) 12px, transparent 12px);
            pointer-events: none;
        }

        .desktop::after {
            content: "";
            position: absolute;
            bottom: 48px;
            left: 0;
            width: 100%;
            height: 30px;
            background: repeating-linear-gradient(90deg, #2a6a2a 0px, #2a6a2a 4px, #3a7a3a 4px, #3a7a3a 8px);
            pointer-events: none;
        }

        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: linear-gradient(180deg, #2a5a2a 0%, #1a4a1a 100%);
            border-top: 2px solid #5aaa5a;
            display: flex;
            align-items: center;
            padding: 0 8px;
            z-index: 100;
            gap: 6px;
        }

        .start-btn {
            background: linear-gradient(180deg, #3a7a2a 0%, #2a5a1a 100%);
            padding: 6px 14px;
            font-weight: bold;
            cursor: pointer;
            color: #ffffaa;
            font-family: monospace;
            border: 1px solid #7aaa5a;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .taskbar-apps { display: flex; gap: 4px; flex: 1; }
        .taskbar-item { background: #2a5a2a; padding: 4px 10px; cursor: pointer; font-size: 11px; border: 1px solid #5aaa5a; color: #ccffcc; }
        .taskbar-time { color: #aaffaa; background: #1a3a1a; padding: 4px 8px; font-size: 11px; border: 1px solid #4a8a4a; }

        .desktop-icons {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 10;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            cursor: pointer;
            padding: 6px;
            color: #ffffdd;
            text-shadow: 1px 1px 0 #0a2a0a;
            background: rgba(0,0,0,0.25);
        }
        .desktop-icon:hover { background: rgba(80,160,80,0.4); outline: 1px solid #aaffaa; }
        .desktop-icon span:first-child { font-size: 36px; }
        .desktop-icon span:last-child { font-size: 10px; text-align: center; margin-top: 4px; }

        .window {
            position: absolute;
            background: #3a5a3a;
            border: 3px solid #8affaa;
            box-shadow: 6px 6px 0 #0a1f0a;
            display: none;
            z-index: 50;
            min-width: 480px;
            min-height: 380px;
            flex-direction: column;
        }

        .window-header {
            background: linear-gradient(90deg, #1a4a2a 0%, #2a6a2a 100%);
            padding: 6px 10px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            color: #ffffaa;
            font-weight: bold;
            border-bottom: 1px solid #6aaa4a;
        }
        .window-content { flex: 1; background: #2a4a2a; padding: 12px; overflow: auto; color: #ccffcc; font-size: 12px; }
        .close-btn { cursor: pointer; background: #5a2a2a; padding: 0 8px; border: 1px solid #aa6a6a; }

        .folder-item { background: #3a5a3a; padding: 8px; margin: 6px 0; cursor: pointer; border-left: 4px solid #aaffaa; }

        .snake-grid { display: grid; grid-template-columns: repeat(20, 18px); gap: 1px; background: #1a3a1a; justify-content: center; }
        .snake-cell { width: 18px; height: 18px; background: #2a5a2a; }
        .snake-cell.snake { background: #aaffaa; }
        .snake-cell.food { background: #ffaa66; }
        .mine-cell { width: 32px; height: 32px; background: #4a6a4a; text-align: center; line-height: 30px; cursor: pointer; border: 1px solid #6a9a6a; font-weight: bold; }
        .game-btn { background: #3a7a2a; padding: 4px 12px; margin: 4px; cursor: pointer; border: 1px solid #aaffaa; color: #ffffaa; font-family: monospace; }
        input, textarea { background: #1a2a15; color: #aaffaa; border: 1px solid #6aaa4a; padding: 4px; font-family: monospace; }

        .start-menu {
            position: fixed;
            bottom: 48px;
            left: 8px;
            width: 220px;
            background: #2a4a2a;
            border: 2px solid #8affaa;
            display: none;
            z-index: 200;
            flex-direction: column;
        }
        .start-menu-item { padding: 8px 12px; cursor: pointer; color: #ccffcc; border-bottom: 1px solid #4a7a4a; }
        .start-menu-item:hover { background: #3a6a3a; }

        .naval-cell { width: 35px; height: 35px; border: 1px solid #6a9a6a; text-align: center; line-height: 33px; cursor: pointer; font-weight: bold; background: #3a6a4a; }
        .naval-cell.ship { background: #5a8a5a; }
        .naval-cell.hit { background: #8a6a4a; }
        .naval-cell.miss { background: #2a5a2a; }
        .online-user { background: #3a7a2a; padding: 5px; margin: 3px; cursor: pointer; border: 1px solid #aaffaa; }
        .online-user:hover { background: #5a9a3a; }
    </style>
</head>
<body>
<div class="login-screen" id="loginScreen">
    <div class="login-container">
        <h2>⚡ PIXEL XP ⚡<br><small>MILITAR EDITION</small></h2>
        <div class="login-tabs">
            <button class="tab-btn active" id="tabLoginBtn">ENTRAR</button>
            <button class="tab-btn" id="tabRegisterBtn">CRIAR CONTA</button>
        </div>
        <div id="loginForm" class="login-form">
            <input type="text" id="loginUsername" placeholder="USUÁRIO">
            <input type="password" id="loginPassword" placeholder="SENHA">
            <button id="doLoginBtn">ACESSAR SISTEMA</button>
            <div id="loginErrorMsg" class="error-msg"></div>
        </div>
        <div id="registerForm" class="register-form" style="display: none;">
            <input type="text" id="regUsername" placeholder="NOVO USUÁRIO">
            <input type="password" id="regPassword" placeholder="SENHA">
            <input type="password" id="regConfirmPassword" placeholder="CONFIRMAR SENHA">
            <button id="doRegisterBtn">CRIAR CONTA</button>
            <div id="registerMsg" class="success-msg"></div>
        </div>
    </div>
</div>

<div class="desktop" id="desktop">
    <div class="taskbar">
        <div class="start-btn" id="startMenuBtn"><span>🏁</span> INICIAR</div>
        <div class="taskbar-apps" id="taskbarApps"></div>
        <div class="taskbar-time" id="clock"></div>
    </div>
    <div class="desktop-icons" id="desktopIcons"></div>
    <div id="windowContainer"></div>
    <div id="startMenu" class="start-menu">
        <div class="start-menu-item" data-app="ficha">📁 MINHA FICHA</div>
        <div class="start-menu-item" data-app="mines">💣 CAMPO MINADO</div>
        <div class="start-menu-item" data-app="naval">⚓ BATALHA NAVAL (MULTIPLAYER)</div>
        <div class="start-menu-item" data-app="snake">🐍 JOGO DA COBRA (WASD)</div>
        <div class="start-menu-item" data-app="dino">🦖 DINO RUN</div>
        <div class="start-menu-item" data-app="files">🗂️ ARQUIVOS</div>
        <div class="start-menu-item" id="shutdownBtn">🔒 DESLIGAR</div>
    </div>
</div>

<script>
    // ========== SISTEMA DE USUÁRIOS ==========
    let usersDB = JSON.parse(localStorage.getItem('pixel_users')) || { admin: "1234" };
    let currentUser = null;
    let onlineUsers = JSON.parse(localStorage.getItem('pixel_online')) || [];
    
    function saveUsers() { localStorage.setItem('pixel_users', JSON.stringify(usersDB)); }
    function saveOnline() { localStorage.setItem('pixel_online', JSON.stringify(onlineUsers)); }
    
    function updateOnlineStatus() {
        if (currentUser && !onlineUsers.includes(currentUser)) {
            onlineUsers.push(currentUser);
            saveOnline();
        }
    }
    
    function removeOnlineUser() {
        onlineUsers = onlineUsers.filter(u => u !== currentUser);
        saveOnline();
    }

    // ========== SISTEMA DE DESAFIOS DE BATALHA NAVAL ==========
    let pendingChallenges = JSON.parse(localStorage.getItem('naval_challenges')) || [];
    let activeGames = JSON.parse(localStorage.getItem('naval_games')) || [];
    
    function saveChallenges() { localStorage.setItem('naval_challenges', JSON.stringify(pendingChallenges)); }
    function saveGames() { localStorage.setItem('naval_games', JSON.stringify(activeGames)); }

    // ========== LOGIN ==========
    document.getElementById('doLoginBtn').onclick = () => {
        let user = document.getElementById('loginUsername').value.trim();
        let pass = document.getElementById('loginPassword').value;
        if (usersDB[user] && usersDB[user] === pass) {
            currentUser = user;
            updateOnlineStatus();
            document.getElementById('desktop').style.display = 'block';
            document.getElementById('loginScreen').style.display = 'none';
            initDesktop();
        } else document.getElementById('loginErrorMsg').innerText = "❌ Usuário ou senha inválidos!";
    };
    
    document.getElementById('doRegisterBtn').onclick = () => {
        let user = document.getElementById('regUsername').value.trim();
        let pass = document.getElementById('regPassword').value;
        let confirm = document.getElementById('regConfirmPassword').value;
        if (!user || !pass) { document.getElementById('registerMsg').innerText = "❌ Preencha todos os campos!"; return; }
        if (pass !== confirm) { document.getElementById('registerMsg').innerText = "❌ Senhas não coincidem!"; return; }
        if (usersDB[user]) { document.getElementById('registerMsg').innerText = "❌ Usuário já existe!"; return; }
        usersDB[user] = pass;
        saveUsers();
        document.getElementById('registerMsg').innerText = "✅ Conta criada! Faça login.";
        setTimeout(() => { document.getElementById('tabLoginBtn').click(); }, 1500);
    };
    
    document.getElementById('tabRegisterBtn').onclick = () => { document.getElementById('loginForm').style.display = 'none'; document.getElementById('registerForm').style.display = 'flex'; document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active')); };
    document.getElementById('tabLoginBtn').onclick = () => { document.getElementById('registerForm').style.display = 'none'; document.getElementById('loginForm').style.display = 'flex'; document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active')); };

    // ========== DESKTOP ==========
    function initDesktop() {
        renderDesktopIcons();
        updateClock();
        setInterval(updateClock, 1000);
        initStartMenu();
        checkPendingChallenges();
        setInterval(checkPendingChallenges, 5000);
    }
    
    function checkPendingChallenges() {
        let myChallenges = pendingChallenges.filter(c => c.to === currentUser && c.status === 'pending');
        if (myChallenges.length > 0) {
            myChallenges.forEach(challenge => {
                if (confirm(`⚓ ${challenge.from} desafiou você para uma BATALHA NAVAL! Aceitar?`)) {
                    challenge.status = 'accepted';
                    activeGames.push({
                        id: challenge.id,
                        player1: challenge.from,
                        player2: challenge.to,
                        turn: challenge.from,
                        board1: initEmptyBoard(),
                        board2: initEmptyBoard(),
                        hits1: initEmptyBoard(),
                        hits2: initEmptyBoard(),
                        ships1: placeShips(),
                        ships2: placeShips(),
                        gameOver: false,
                        winner: null
                    });
                    saveChallenges();
                    saveGames();
                    alert(`🎯 Desafio aceito! Abra o jogo para continuar.`);
                } else {
                    challenge.status = 'declined';
                    saveChallenges();
                }
            });
        }
    }
    
    function initEmptyBoard() { return Array(8).fill().map(() => Array(8).fill(false)); }
    function placeShips() {
        let board = initEmptyBoard();
        let ships = [[0,0], [2,3], [5,5], [7,1]];
        ships.forEach(([r,c]) => { if(r<8 && c<8) board[r][c] = true; });
        return board;
    }

    function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString() + "  " + new Date().toLocaleDateString(); }
    
    function initStartMenu() {
        let startBtn = document.getElementById('startMenuBtn');
        let startMenu = document.getElementById('startMenu');
        startBtn.onclick = (e) => { e.stopPropagation(); startMenu.style.display = startMenu.style.display === 'flex' ? 'none' : 'flex'; };
        document.body.onclick = () => { startMenu.style.display = 'none'; };
        document.querySelectorAll('.start-menu-item[data-app]').forEach(el => { el.onclick = () => { openApp(el.dataset.app); startMenu.style.display = 'none'; }; });
        document.getElementById('shutdownBtn').onclick = () => { removeOnlineUser(); document.getElementById('desktop').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; startMenu.style.display = 'none'; };
    }

    const icons = [
        { name: "MINHA FICHA", icon: "📁", action: "ficha" },
        { name: "CAMPO MINADO", icon: "💣", action: "mines" },
        { name: "BATALHA NAVAL", icon: "⚓", action: "naval" },
        { name: "COBRA (WASD)", icon: "🐍", action: "snake" },
        { name: "DINO RUN", icon: "🦖", action: "dino" },
        { name: "ARQUIVOS", icon: "🗂️", action: "files" }
    ];
    
    function renderDesktopIcons() {
        const container = document.getElementById('desktopIcons');
        container.innerHTML = icons.map(icon => `<div class="desktop-icon" data-action="${icon.action}"><span>${icon.icon}</span><span>${icon.name}</span></div>`).join('');
        document.querySelectorAll('.desktop-icon').forEach(el => { el.addEventListener('click', () => openApp(el.dataset.action)); });
    }

    let militarData = JSON.parse(localStorage.getItem('pixel_ficha')) || { unidade: "FORCA ALFA", codinome: "FANTASMA", id: "FT-210", patente: "SGT", vida: "32/32", defB: "16", defE: "14", municao: "90/120", mov1: "8m", mov2: "12m", inv1: "Fuzil M4", inv2: "Granada", inv3: "Kit Medico", inv4: "Radio", hab1: "Precisao", hab2: "Demolicao", hab3: "Furtivo", hab4: "Lideranca", missao: "OP: TERRA", data: "16/05", notas: "Extracao Norte" };
    function saveFicha() { localStorage.setItem('pixel_ficha', JSON.stringify(militarData)); }

    let windowZ = 100, openWindows = [];
    function createWindow(title, contentHtml, width = 520, height = 420) {
        const winId = 'win_' + Date.now() + Math.random();
        const winDiv = document.createElement('div'); winDiv.className = 'window'; winDiv.id = winId;
        winDiv.style.width = width + 'px'; winDiv.style.height = height + 'px';
        winDiv.style.left = (50 + openWindows.length * 25) + 'px'; winDiv.style.top = (50 + openWindows.length * 25) + 'px';
        winDiv.style.zIndex = windowZ++;
        winDiv.innerHTML = `<div class="window-header"><span>${title}</span><span class="close-btn">X</span></div><div class="window-content">${contentHtml}</div>`;
        document.getElementById('windowContainer').appendChild(winDiv);
        winDiv.style.display = 'flex';
        winDiv.querySelector('.close-btn').onclick = () => { winDiv.remove(); openWindows = openWindows.filter(w => w !== winId); updateTaskbar(); };
        let drag = false, offsetX, offsetY;
        winDiv.querySelector('.window-header').addEventListener('mousedown', (e) => { if(e.target.classList.contains('close-btn')) return; drag = true; offsetX = e.clientX - winDiv.offsetLeft; offsetY = e.clientY - winDiv.offsetTop; winDiv.style.zIndex = windowZ++; });
        window.addEventListener('mousemove', (e) => { if(drag) { winDiv.style.left = (e.clientX - offsetX) + 'px'; winDiv.style.top = (e.clientY - offsetY) + 'px'; } });
        window.addEventListener('mouseup', () => { drag = false; });
        openWindows.push(winId); updateTaskbar();
        return winDiv;
    }
    
    function updateTaskbar() {
        let container = document.getElementById('taskbarApps');
        container.innerHTML = openWindows.map(id => `<div class="taskbar-item" data-win="${id}">📄 ${document.getElementById(id)?.querySelector('.window-header span:first-child')?.innerText || 'Janela'}</div>`).join('');
        document.querySelectorAll('.taskbar-item').forEach(el => { el.onclick = () => { let win = document.getElementById(el.dataset.win); if(win) { win.style.zIndex = windowZ++; win.style.display = 'flex'; } }; });
    }
    
    function openApp(action) {
        if(action === 'ficha') openFicha();
        else if(action === 'mines') openMines();
        else if(action === 'naval') openNavalMultiplayer();
        else if(action === 'snake') openSnake();
        else if(action === 'dino') openDino();
        else if(action === 'files') openFiles();
    }

    function openFicha() {
        let html = `<div><h3>📋 FICHA MILITAR - ${currentUser}</h3>
            <div>UNIDADE: <input id="f_unidade" value="${militarData.unidade}"></div>
            <div>CODINOME: <input id="f_cod" value="${militarData.codinome}"> ID: <input id="f_id" value="${militarData.id}"></div>
            <div>PATENTE: <input id="f_pat" value="${militarData.patente}"></div>
            <hr><b>ESTATÍSTICAS</b><br>VIDA: <input id="f_vida" size="6" value="${militarData.vida}"> DEF.BAL: <input id="f_defb" size="4" value="${militarData.defB}"> DEF.EXP: <input id="f_defe" size="4" value="${militarData.defE}"><br>
            MUNIÇÃO: <input id="f_mun" value="${militarData.municao}"> MOV: <input id="f_m1" size="3" value="${militarData.mov1}"> / <input id="f_m2" size="3" value="${militarData.mov2}"><br>
            <b>INVENTÁRIO</b><br>1:<input id="f_i1" value="${militarData.inv1}"> 2:<input id="f_i2" value="${militarData.inv2}"><br>3:<input id="f_i3" value="${militarData.inv3}"> 4:<input id="f_i4" value="${militarData.inv4}"><br>
            <b>HABILIDADES</b><br>1:<input id="f_h1" value="${militarData.hab1}"> 2:<input id="f_h2" value="${militarData.hab2}"><br>3:<input id="f_h3" value="${militarData.hab3}"> 4:<input id="f_h4" value="${militarData.hab4}"><br>
            <b>MISSÃO</b><br><input id="f_miss" value="${militarData.missao}"> DATA: <input id="f_data" value="${militarData.data}"><br>
            NOTAS: <textarea id="f_notas" rows="2">${militarData.notas}</textarea><br>
            <button id="saveBtn" class="game-btn">SALVAR</button></div>`;
        createWindow("MINHA FICHA", html, 550, 520);
        setTimeout(() => { document.getElementById('saveBtn').onclick = () => { Object.keys(militarData).forEach(k => { let el = document.getElementById(`f_${k}`); if(el) militarData[k] = el.value; }); saveFicha(); alert("Ficha salva!"); }; }, 10);
    }
    
    function openFiles() {
        let html = `<div><h3>📁 ARQUIVOS</h3><div class="folder-item" id="showUsers">🔐 USUÁRIOS</div><div class="folder-item" id="showLogs">📜 LOGS</div><div id="fileView"></div></div>`;
        createWindow("EXPLORADOR", html, 480, 400);
        setTimeout(() => {
            document.getElementById('showUsers').onclick = () => document.getElementById('fileView').innerHTML = `<pre>${JSON.stringify(usersDB, null, 2)}</pre><p>Online: ${onlineUsers.join(', ')}</p>`;
            document.getElementById('showLogs').onclick = () => document.getElementById('fileView').innerHTML = `<pre>Usuário atual: ${currentUser}</pre>`;
        }, 50);
    }

    // ========== CAMPO MINADO ==========
    function openMines() {
        let html = `<div><h3>💣 CAMPO MINADO</h3><div id="minesDiv"></div><div id="mineStatus" style="margin-top:10px;font-weight:bold;"></div><button id="newMine" class="game-btn">NOVO JOGO</button></div>`;
        createWindow("CAMPO MINADO", html, 450, 500);
        let size = 8, mines = 10, board, revealed, gameOver = false;
        function initGame() {
            gameOver = false;
            board = Array(size).fill().map(() => Array(size).fill(0));
            revealed = Array(size).fill().map(() => Array(size).fill(false));
            let minePos = [];
            while (minePos.length < mines) { let r = Math.floor(Math.random() * size), c = Math.floor(Math.random() * size); if (!minePos.some(m => m[0] === r && m[1] === c)) minePos.push([r, c]); }
            for (let [r, c] of minePos) board[r][c] = 'M';
            for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (board[r][c] !== 'M') { let cnt = 0; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { let nr = r + dr, nc = c + dc; if (nr >= 0 && nr < size && nc >= 0 && nc < size && board[nr][nc] === 'M') cnt++; } board[r][c] = cnt; }
            render();
            document.getElementById('mineStatus').innerText = '';
        }
        function render() {
            let cont = document.getElementById('minesDiv'); if (!cont) return;
            cont.style.display = 'grid'; cont.style.gridTemplateColumns = `repeat(${size}, 35px)`;
            cont.innerHTML = '';
            for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) {
                let cell = document.createElement('div'); cell.className = 'mine-cell';
                cell.style.background = revealed[i][j] ? '#5a8a5a' : '#3a5a3a';
                if (revealed[i][j]) cell.innerText = board[i][j] === 'M' ? '💣' : (board[i][j] || '');
                if (!gameOver && !revealed[i][j]) cell.onclick = () => {
                    if (board[i][j] === 'M') {
                        gameOver = true;
                        document.getElementById('mineStatus').innerText = '💥 DERROTA! Você explodiu uma mina! 💥';
                        for (let x = 0; x < size; x++) for (let y = 0; y < size; y++) if (board[x][y] === 'M') revealed[x][y] = true;
                        render();
                    } else { revealed[i][j] = true; render(); }
                };
                cont.appendChild(cell);
            }
        }
        initGame();
        document.getElementById('newMine')?.addEventListener('click', () => initGame());
    }

    // ========== BATALHA NAVAL MULTIPLAYER ==========
    function openNavalMultiplayer() {
        let onlineList = onlineUsers.filter(u => u !== currentUser);
        let myGames = activeGames.filter(g => g.player1 === currentUser || g.player2 === currentUser);
        
        let html = `<div>
            <h3>⚓ BATALHA NAVAL MULTIPLAYER</h3>
            <div style="background:#1a3a1a; padding:10px; margin:10px 0;">
                <h4>👥 USUÁRIOS ONLINE</h4>
                <div id="onlineUsersList">${onlineList.map(u => `<div class="online-user" data-user="${u}">🎯 DESAFIAR ${u}</div>`).join('') || '<p>Nenhum outro usuário online</p>'}</div>
            </div>
            <div style="background:#1a3a1a; padding:10px; margin:10px 0;">
                <h4>🎮 PARTIDAS ATIVAS</h4>
                <div id="activeGamesList">${myGames.map(g => `<div class="folder-item" data-game="${g.id}">⚔️ ${g.player1} vs ${g.player2} - ${g.gameOver ? 'FINALIZADO' : `Turno: ${g.turn}`}</div>`).join('') || '<p>Nenhuma partida ativa</p>'}</div>
            </div>
            <div id="gameBoardContainer" style="margin-top:15px;"></div>
        </div>`;
        
        let win = createWindow("BATALHA NAVAL MULTIPLAYER", html, 800, 600);
        
        setTimeout(() => {
            document.querySelectorAll('.online-user').forEach(el => {
                el.onclick = () => {
                    let opponent = el.dataset.user;
                    if (confirm(`Enviar desafio para ${opponent}?`)) {
                        let challengeId = Date.now() + Math.random();
                        pendingChallenges.push({
                            id: challengeId,
                            from: currentUser,
                            to: opponent,
                            status: 'pending',
                            timestamp: Date.now()
                        });
                        saveChallenges();
                        alert(`Desafio enviado para ${opponent}! Aguardando resposta...`);
                    }
                };
            });
            
            document.querySelectorAll('[data-game]').forEach(el => {
                el.onclick = () => {
                    let gameId = el.dataset.game;
                    let game = activeGames.find(g => g.id == gameId);
                    if (game) renderGameBoard(game);
                };
            });
        }, 50);
        
        function renderGameBoard(game) {
            let container = document.getElementById('gameBoardContainer');
            if (!container) return;
            
            let isMyTurn = game.turn === currentUser;
            let amIPlayer1 = game.player1 === currentUser;
            let myShips = amIPlayer1 ? game.ships1 : game.ships2;
            let myHits = amIPlayer1 ? game.hits1 : game.hits2;
            let opponentShips = amIPlayer1 ? game.ships2 : game.ships1;
            let opponentHits = amIPlayer1 ? game.hits2 : game.hits1;
            let opponentName = amIPlayer1 ? game.player2 : game.player1;
            
            let myScore = myHits.flat().filter((v, i) => v && opponentShips.flat()[i]).length;
            let opponentScore = opponentHits.flat().filter((v, i) => v && myShips.flat()[i]).length;
            
            container.innerHTML = `
                <div style="display:flex; gap:30px; flex-wrap:wrap; justify-content:center;">
                    <div>
                        <h3>🌊 SEU CAMPO (${currentUser})</h3>
                        <div id="myBoard" style="display:grid; grid-template-columns:repeat(8,35px); gap:2px;"></div>
                        <p>Navios restantes: ${4 - myHits.flat().filter((v,i) => v && myShips.flat()[i]).length}/4</p>
                    </div>
                    <div>
                        <h3>🎯 ATAQUE A ${opponentName}</h3>
                        <div id="attackBoard" style="display:grid; grid-template-columns:repeat(8,35px); gap:2px;"></div>
                        <p>Acertos: ${opponentScore}/4</p>
                    </div>
                </div>
                <div style="text-align:center; margin-top:15px;">
                    <p>${game.gameOver ? `🏆 VENCEDOR: ${game.winner} 🏆` : (isMyTurn ? '✅ SUA VEZ DE ATACAR!' : '⏳ AGUARDANDO OPONENTE...')}</p>
                    <button id="refreshGameBtn" class="game-btn">ATUALIZAR</button>
                    <button id="exitGameBtn" class="game-btn">SAIR</button>
                </div>
            `;
            
            let myBoardDiv = document.getElementById('myBoard');
            let attackBoardDiv = document.getElementById('attackBoard');
            
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    let myCell = document.createElement('div');
                    myCell.className = 'naval-cell';
                    if (myShips[i][j]) myCell.classList.add('ship');
                    if (opponentHits[i][j]) myCell.classList.add('hit');
                    myCell.innerText = opponentHits[i][j] ? (myShips[i][j] ? '💥' : '❌') : (myShips[i][j] ? '⬛' : '🌊');
                    myBoardDiv.appendChild(myCell);
                    
                    let attackCell = document.createElement('div');
                    attackCell.className = 'naval-cell';
                    if (myHits[i][j]) attackCell.classList.add(myHits[i][j] && opponentShips[i][j] ? 'hit' : 'miss');
                    attackCell.innerText = myHits[i][j] ? (opponentShips[i][j] ? '💥' : '❌') : '?';
                    if (!game.gameOver && isMyTurn && !myHits[i][j]) {
                        attackCell.style.cursor = 'pointer';
                        attackCell.onclick = () => makeAttack(game, i, j, amIPlayer1, opponentName);
                    }
                    attackBoardDiv.appendChild(attackCell);
                }
            }
            
            document.getElementById('refreshGameBtn').onclick = () => {
                let updatedGame = activeGames.find(g => g.id === game.id);
                if (updatedGame) renderGameBoard(updatedGame);
                else container.innerHTML = '<p>Partida finalizada ou não encontrada.</p>';
            };
            document.getElementById('exitGameBtn').onclick = () => { container.innerHTML = '<p>Selecione uma partida na lista acima.</p>'; };
        }
        
        function makeAttack(game, row, col, amIPlayer1, opponentName) {
            let currentGame = activeGames.find(g => g.id === game.id);
            if (!currentGame || currentGame.gameOver) return;
            if (currentGame.turn !== currentUser) { alert("Não é sua vez!"); return; }
            
            let myHits = amIPlayer1 ? currentGame.hits1 : currentGame.hits2;
            let opponentShips = amIPlayer1 ? currentGame.ships2 : currentGame.ships1;
            
            if (myHits[row][col]) { alert("Você já atacou esta posição!"); return; }
            
            myHits[row][col] = true;
            let hit = opponentShips[row][col];
            
            let totalShips = 4;
            let hitsCount = myHits.flat().filter((v,i) => v && opponentShips.flat()[i]).length;
            
            if (hitsCount === totalShips) {
                currentGame.gameOver = true;
                currentGame.winner = currentUser;
                alert(`🎉 PARABÉNS! ${currentUser} venceu a batalha naval! 🎉`);
            } else {
                currentGame.turn = opponentName;
            }
            
            saveGames();
            renderGameBoard(currentGame);
            
            setTimeout(() => {
                let updated = activeGames.find(g => g.id === game.id);
                if (updated) renderGameBoard(updated);
            }, 500);
        }
    }

    // ========== JOGO DA COBRA ==========
    function openSnake() {
        let html = `<div><h3>🐍 JOGO DA COBRA (WASD)</h3><div id="snakeGrid" class="snake-grid"></div><button id="startSnakeBtn" class="game-btn">INICIAR</button><p>Score: <span id="snakeScore">0</span></p><p style="font-size:10px;">Use W A S D para mover</p></div>`;
        createWindow("SNAKE", html, 450, 500);
        let snakeBody = [[10,10]], dir = "RIGHT", food = [15,15], gameOn = false, score = 0, interval;
        function buildGrid() {
            let grid = document.getElementById('snakeGrid'); if (!grid) return;
            grid.innerHTML = '';
            for (let i = 0; i < 20; i++) for (let j = 0; j < 20; j++) {
                let cell = document.createElement('div'); cell.className = 'snake-cell';
                if (snakeBody.some(s => s[0] === i && s[1] === j)) cell.classList.add('snake');
                if (food[0] === i && food[1] === j) cell.classList.add('food');
                grid.appendChild(cell);
            }
        }
        function update() {
            if (!gameOn) return;
            let head = snakeBody[0], newHead = [...head];
            if (dir === 'RIGHT') newHead[1]++; if (dir === 'LEFT') newHead[1]--; if (dir === 'UP') newHead[0]--; if (dir === 'DOWN') newHead[0]++;
            if (newHead[0] < 0 || newHead[0] >= 20 || newHead[1] < 0 || newHead[1] >= 20 || snakeBody.some(s => s[0] === newHead[0] && s[1] === newHead[1])) {
                gameOn = false; clearInterval(interval); alert("GAME OVER!"); return;
            }
            snakeBody.unshift(newHead);
            if (newHead[0] === food[0] && newHead[1] === food[1]) { score++; document.getElementById('snakeScore').innerText = score; food = [Math.floor(Math.random() * 20), Math.floor(Math.random() * 20)]; }
            else snakeBody.pop();
            buildGrid();
        }
        document.getElementById('startSnakeBtn')?.addEventListener('click', () => {
            if (interval) clearInterval(interval);
            snakeBody = [[10,10]]; dir = "RIGHT"; score = 0; food = [15,15]; gameOn = true;
            document.getElementById('snakeScore').innerText = '0'; buildGrid();
            interval = setInterval(update, 150);
        });
        window.addEventListener('keydown', (e) => {
            if (!gameOn) return;
            let key = e.key.toLowerCase();
            if (key === 'w' && dir !== 'DOWN') dir = 'UP';
            else if (key === 's' && dir !== 'UP') dir = 'DOWN';
            else if (key === 'a' && dir !== 'RIGHT') dir = 'LEFT';
            else if (key === 'd' && dir !== 'LEFT') dir = 'RIGHT';
        });
        buildGrid();
    }

    // ========== DINO GAME ==========
    function openDino() {
        let html = `<div><h3>🦖 DINO RUN</h3><div id="dinoArea" style="height:150px;background:#2a4a2a;position:relative;margin:10px;overflow:hidden;">
            <div id="dino" style="position:absolute;bottom:0;left:50px;width:25px;height:25px;background:#aaffaa;"></div>
            <div id="obs" style="position:absolute;bottom:0;right:0;width:20px;height:25px;background:#aa8a6a;"></div>
        </div><p>Score: <span id="dinoScore">0</span></p><button id="startDinoBtn" class="game-btn">CORRER</button><p style="font-size:10px;">Pressione ESPAÇO para pular</p></div>`;
        createWindow("DINO RUN", html, 480, 350);
        let dinoRun = false, score = 0, obsX = 300, jump = false, yPos = 0, loop;
        function gameLoop() {
            if (!dinoRun) return;
            obsX -= 6;
            if (obsX < 0) { obsX = 280; score++; document.getElementById('dinoScore').innerText = score; }
            document.getElementById('obs').style.right = (300 - obsX) + 'px';
            let dinoElem = document.getElementById('dino');
            if (!jump && yPos === 0 && Math.abs(obsX - 50) < 25) {
                dinoRun = false; clearInterval(loop);
                alert("💀 GAME OVER! Pontuação: " + score);
            }
            if (jump) {
                yPos -= 1.5;
                if (yPos <= -25) { jump = false; yPos = 0; }
                dinoElem.style.bottom = yPos + 20 + 'px';
            } else dinoElem.style.bottom = '0px';
        }
        document.getElementById('startDinoBtn')?.addEventListener('click', () => {
            if (loop) clearInterval(loop);
            obsX = 300; score = 0; dinoRun = true; jump = false; yPos = 0;
            document.getElementById('dinoScore').innerText = '0';
            loop = setInterval(gameLoop, 30);
        });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && dinoRun && !jump) { e.preventDefault(); jump = true; yPos = 20; }
        });
    }
    
    window.addEventListener('beforeunload', () => { if(currentUser) removeOnlineUser(); });
</script>
