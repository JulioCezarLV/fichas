<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PIXEL OS - Sistema Militar XP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            font-family: 'Courier New', 'VT323', monospace;
            background: #0a0f0a;
            overflow: hidden;
            height: 100vh;
        }

        /* TELA DE LOGIN PIXEL */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a3f2a;
            background-image: repeating-linear-gradient(0deg, #0a2f1a 1px, #1a4f2a 2px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-box {
            background: #2a4a2a;
            border: 4px solid #8affaa;
            padding: 30px;
            width: 340px;
            box-shadow: 8px 8px 0 #0a1f0a;
            text-align: center;
            image-rendering: pixelated;
        }

        .login-box h2 {
            color: #aaffaa;
            text-shadow: 2px 2px 0 #0a3f0a;
            font-size: 22px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .login-box input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            background: #1a2a15;
            border: 2px solid #6aaa4a;
            color: #8aff6a;
            font-family: monospace;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 8px;
            background: #3a7a2a;
            color: #ffffaa;
            border: 2px solid #aaffaa;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-box button:hover { background: #5a9a3a; }
        .error-msg { color: #ffaa66; margin-top: 10px; font-size: 11px; }

        /* DESKTOP XP PIXEL */
        .desktop {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #2a6a3a;
            background-image: radial-gradient(circle at 10px 10px, #3a8a4a 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
            overflow: hidden;
        }

        /* BARRA DE TAREFAS XP */
        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: #1a4a2a;
            border-top: 2px solid #6aaa4a;
            display: flex;
            align-items: center;
            padding: 0 10px;
            z-index: 100;
            gap: 8px;
            box-shadow: 0 -2px 0 #0a2a0a;
        }

        .start-btn {
            background: #3a6a2a;
            padding: 6px 16px;
            font-weight: bold;
            cursor: pointer;
            color: #ffffaa;
            font-family: monospace;
            border: 1px solid #8affaa;
            font-size: 14px;
        }

        .taskbar-apps {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .taskbar-item {
            background: #2a5a2a;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 11px;
            border: 1px solid #5aaa5a;
        }

        .taskbar-time {
            color: #aaffaa;
            font-family: monospace;
            background: #1a3a1a;
            padding: 4px 8px;
        }

        /* ÍCONES DA ÁREA DE TRABALHO */
        .desktop-icons {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 75px;
            cursor: pointer;
            padding: 6px;
            transition: 0.05s linear;
            color: #ffffcc;
            text-shadow: 1px 1px 0 #0a2a0a;
            background: rgba(0,0,0,0.3);
        }

        .desktop-icon:hover { background: rgba(100,200,100,0.3); outline: 1px solid #aaffaa; }
        .desktop-icon span:first-child { font-size: 32px; filter: drop-shadow(2px 2px 0 #0a2a0a); }
        .desktop-icon span:last-child { font-size: 10px; text-align: center; margin-top: 4px; }

        /* JANELAS ESTILO XP */
        .window {
            position: absolute;
            background: #3a5a3a;
            border: 3px solid #8affaa;
            box-shadow: 6px 6px 0 #0a1f0a;
            display: none;
            z-index: 50;
            min-width: 480px;
            min-height: 380px;
            flex-direction: column;
        }

        .window-header {
            background: #1a4a2a;
            padding: 6px 10px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            color: #ffffaa;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px solid #6aaa4a;
        }

        .window-content {
            flex: 1;
            background: #2a4a2a;
            padding: 12px;
            overflow: auto;
            color: #ccffcc;
            font-size: 12px;
        }

        .close-btn { cursor: pointer; background: #5a2a2a; padding: 0 8px; }

        /* PASTAS */
        .folder-item {
            background: #3a5a3a;
            padding: 8px;
            margin: 6px 0;
            cursor: pointer;
            border-left: 4px solid #aaffaa;
        }

        /* CHAT ORKUT */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 320px;
        }
        .chat-messages {
            flex: 1;
            background: #1a3a1a;
            overflow-y: auto;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #6aaa4a;
        }
        .chat-message {
            margin: 4px 0;
            padding: 4px;
            border-bottom: 1px solid #5a8a5a;
        }
        .chat-input-area {
            display: flex;
            gap: 6px;
        }
        .chat-input-area input {
            flex: 1;
            background: #1a2a15;
            border: 1px solid #6aaa4a;
            color: #aaffaa;
            padding: 5px;
        }
        .user-list {
            background: #2a4a2a;
            padding: 8px;
            margin-top: 8px;
            max-height: 120px;
            overflow-y: auto;
        }
        .user-item {
            cursor: pointer;
            padding: 3px;
            margin: 2px;
            background: #3a6a3a;
        }

        /* JOGOS PIXEL */
        .game-board { text-align: center; }
        .snake-grid { display: grid; grid-template-columns: repeat(20, 18px); gap: 1px; background: #1a3a1a; justify-content: center; }
        .snake-cell { width: 18px; height: 18px; background: #2a5a2a; }
        .snake-cell.snake { background: #aaffaa; }
        .snake-cell.food { background: #ffaa66; border-radius: 0; }
        .mine-cell { width: 32px; height: 32px; background: #4a6a4a; text-align: center; line-height: 30px; cursor: pointer; border: 1px solid #6a9a6a; }
        .game-btn { background: #3a7a2a; padding: 4px 12px; margin: 4px; cursor: pointer; border: 1px solid #aaffaa; color: #ffffaa; }

        input, textarea { background: #1a2a15; color: #aaffaa; border: 1px solid #6aaa4a; padding: 4px; }
    </style>
</head>
<body>
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h2>⚡ PIXEL OS ⚡<br>XP EDITION</h2>
        <input type="text" id="loginUser" placeholder="USUARIO" autocomplete="off">
        <input type="password" id="loginPass" placeholder="SENHA">
        <button id="loginBtn">ENTRAR NO SISTEMA</button>
        <div id="loginError" class="error-msg"></div>
        <div style="margin-top: 12px; font-size: 10px;">admin / 1234</div>
    </div>
</div>

<div class="desktop" id="desktop">
    <div class="taskbar">
        <div class="start-btn" id="startMenuBtn">[ INICIAR ]</div>
        <div class="taskbar-apps" id="taskbarApps"></div>
        <div class="taskbar-time" id="clock"></div>
    </div>
    <div class="desktop-icons" id="desktopIcons"></div>
    <div id="windowContainer"></div>
</div>

<script>
    // SISTEMA DE USUÁRIOS
    let usersDB = JSON.parse(localStorage.getItem('pixel_users')) || { admin: "1234" };
    let currentUser = null;

    // CHAT GLOBAL (ORKUT) - conversa entre usuários
    let chatMessages = JSON.parse(localStorage.getItem('pixel_chat')) || [];
    let activeChatUser = "GERAL";

    function saveChat() { localStorage.setItem('pixel_chat', JSON.stringify(chatMessages)); }

    // INICIAR DESKTOP
    function initDesktop() {
        document.getElementById('desktop').style.display = 'block';
        document.getElementById('loginScreen').style.display = 'none';
        renderDesktopIcons();
        updateClock();
        setInterval(updateClock, 1000);
    }

    function updateClock() {
        let now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString() + "  " + now.toLocaleDateString();
    }

    // ÍCONES
    const icons = [
        { name: "MINHA FICHA", icon: "📁", action: "ficha" },
        { name: "CAMPO MINADO", icon: "💣", action: "mines" },
        { name: "BATALHA NAVAL", icon: "⚓", action: "naval" },
        { name: "COBRA", icon: "🐍", action: "snake" },
        { name: "DINO RUN", icon: "🦖", action: "dino" },
        { name: "ARQUIVOS", icon: "🗂️", action: "files" },
        { name: "ORKUT", icon: "💬", action: "orkut" }
    ];

    function renderDesktopIcons() {
        const container = document.getElementById('desktopIcons');
        container.innerHTML = icons.map(icon => `
            <div class="desktop-icon" data-action="${icon.action}">
                <span>${icon.icon}</span>
                <span>${icon.name}</span>
            </div>
        `).join('');
        document.querySelectorAll('.desktop-icon').forEach(el => {
            el.addEventListener('click', (e) => { e.stopPropagation(); openApp(el.dataset.action); });
        });
    }

    // DADOS DA FICHA
    let militarData = JSON.parse(localStorage.getItem('pixel_ficha')) || {
        unidade: "FORCA ALFA", codinome: "FANTASMA", id: "FT-210", patente: "SGT",
        vida: "32/32", defB: "16", defE: "14", municao: "90/120", mov1: "8m", mov2: "12m",
        inv1: "Fuzil M4", inv2: "Granada", inv3: "Kit Medico", inv4: "Radio",
        hab1: "Precisao", hab2: "Demolicao", hab3: "Furtivo", hab4: "Lideranca",
        missao: "OP: TERRA", data: "16/05", notas: "Extracao Norte"
    };
    function saveFicha() { localStorage.setItem('pixel_ficha', JSON.stringify(militarData)); }

    // JANELAS
    let windowZ = 100;
    let openWindows = [];

    function createWindow(title, contentHtml, width = 520, height = 420) {
        const winId = 'win_' + Date.now() + Math.random();
        const winDiv = document.createElement('div');
        winDiv.className = 'window';
        winDiv.id = winId;
        winDiv.style.width = width + 'px';
        winDiv.style.height = height + 'px';
        winDiv.style.left = (50 + openWindows.length * 25) + 'px';
        winDiv.style.top = (50 + openWindows.length * 25) + 'px';
        winDiv.style.zIndex = windowZ++;
        winDiv.innerHTML = `
            <div class="window-header">
                <span>${title}</span>
                <span class="close-btn">X</span>
            </div>
            <div class="window-content">${contentHtml}</div>
        `;
        document.getElementById('windowContainer').appendChild(winDiv);
        winDiv.style.display = 'flex';
        winDiv.querySelector('.close-btn').onclick = () => { winDiv.remove(); openWindows = openWindows.filter(w => w !== winId); };
        let drag = false, offsetX, offsetY;
        winDiv.querySelector('.window-header').addEventListener('mousedown', (e) => {
            if(e.target.classList.contains('close-btn')) return;
            drag = true;
            offsetX = e.clientX - winDiv.offsetLeft;
            offsetY = e.clientY - winDiv.offsetTop;
            winDiv.style.zIndex = windowZ++;
        });
        window.addEventListener('mousemove', (e) => {
            if(!drag) return;
            winDiv.style.left = (e.clientX - offsetX) + 'px';
            winDiv.style.top = (e.clientY - offsetY) + 'px';
        });
        window.addEventListener('mouseup', () => { drag = false; });
        openWindows.push(winId);
        return winDiv;
    }

    function openApp(action) {
        if(action === 'ficha') openFicha();
        else if(action === 'mines') openMines();
        else if(action === 'naval') openNaval();
        else if(action === 'snake') openSnake();
        else if(action === 'dino') openDino();
        else if(action === 'files') openFiles();
        else if(action === 'orkut') openOrkut();
    }

    function openFicha() {
        let html = `<div>
            <h3>📋 FICHA MILITAR</h3>
            <div>UNIDADE: <input id="f_unidade" value="${militarData.unidade}"></div>
            <div>CODINOME: <input id="f_cod" value="${militarData.codinome}"> ID: <input id="f_id" value="${militarData.id}"></div>
            <div>PATENTE: <input id="f_pat" value="${militarData.patente}"></div>
            <hr><b>ESTATÍSTICAS</b><br>
            VIDA: <input id="f_vida" size="6" value="${militarData.vida}"> DEF.BAL: <input id="f_defb" size="4" value="${militarData.defB}"> DEF.EXP: <input id="f_defe" size="4" value="${militarData.defE}"><br>
            MUNIÇÃO: <input id="f_mun" value="${militarData.municao}"> MOV: <input id="f_m1" size="3" value="${militarData.mov1}"> / <input id="f_m2" size="3" value="${militarData.mov2}"><br>
            <b>INVENTÁRIO</b><br>1:<input id="f_i1" value="${militarData.inv1}"> 2:<input id="f_i2" value="${militarData.inv2}"><br>3:<input id="f_i3" value="${militarData.inv3}"> 4:<input id="f_i4" value="${militarData.inv4}"><br>
            <b>HABILIDADES</b><br>1:<input id="f_h1" value="${militarData.hab1}"> 2:<input id="f_h2" value="${militarData.hab2}"><br>3:<input id="f_h3" value="${militarData.hab3}"> 4:<input id="f_h4" value="${militarData.hab4}"><br>
            <b>MISSÃO</b><br><input id="f_miss" value="${militarData.missao}"> DATA: <input id="f_data" value="${militarData.data}"><br>
            NOTAS: <textarea id="f_notas" rows="2">${militarData.notas}</textarea><br>
            <button id="saveBtn" class="game-btn">SALVAR</button>
        </div>`;
        let win = createWindow("FICHA MILITAR", html, 550, 500);
        setTimeout(() => {
            document.getElementById('saveBtn').onclick = () => {
                militarData.unidade = document.getElementById('f_unidade').value;
                militarData.codinome = document.getElementById('f_cod').value;
                militarData.id = document.getElementById('f_id').value;
                militarData.patente = document.getElementById('f_pat').value;
                militarData.vida = document.getElementById('f_vida').value;
                militarData.defB = document.getElementById('f_defb').value;
                militarData.defE = document.getElementById('f_defe').value;
                militarData.municao = document.getElementById('f_mun').value;
                militarData.mov1 = document.getElementById('f_m1').value;
                militarData.mov2 = document.getElementById('f_m2').value;
                militarData.inv1 = document.getElementById('f_i1').value;
                militarData.inv2 = document.getElementById('f_i2').value;
                militarData.inv3 = document.getElementById('f_i3').value;
                militarData.inv4 = document.getElementById('f_i4').value;
                militarData.hab1 = document.getElementById('f_h1').value;
                militarData.hab2 = document.getElementById('f_h2').value;
                militarData.hab3 = document.getElementById('f_h3').value;
                militarData.hab4 = document.getElementById('f_h4').value;
                militarData.missao = document.getElementById('f_miss').value;
                militarData.data = document.getElementById('f_data').value;
                militarData.notas = document.getElementById('f_notas').value;
                saveFicha();
                alert("Ficha salva!");
            };
        }, 10);
    }

    // ORKUT - CHAT GLOBAL
    function openOrkut() {
        let html = `<div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Digite sua mensagem...">
                <button id="sendMsgBtn" class="game-btn">ENVIAR</button>
            </div>
            <div class="user-list" id="userList">
                <strong>👥 USUÁRIOS ONLINE:</strong><br>
                <div id="onlineUsers"></div>
            </div>
            <div style="font-size:10px; margin-top:6px;">💬 Orkut Militar - Converse com outros operadores</div>
        </div>`;
        let win = createWindow("ORKUT - REDE SOCIAL MILITAR", html, 550, 500);
        function renderChat() {
            let container = document.getElementById('chatMessages');
            if(!container) return;
            container.innerHTML = chatMessages.map(msg => `<div class="chat-message"><b>${msg.user}</b> [${msg.time}]: ${msg.text}</div>`).join('');
            container.scrollTop = container.scrollHeight;
        }
        function sendMessage() {
            let input = document.getElementById('chatInput');
            if(!input || !input.value.trim()) return;
            let newMsg = { user: currentUser, text: input.value, time: new Date().toLocaleTimeString() };
            chatMessages.push(newMsg);
            if(chatMessages.length > 100) chatMessages.shift();
            saveChat();
            renderChat();
            input.value = '';
        }
        function updateOnlineUsers() {
            let onlineDiv = document.getElementById('onlineUsers');
            if(onlineDiv) onlineDiv.innerHTML = Object.keys(usersDB).map(u => `<div class="user-item">🔹 ${u}</div>`).join('');
        }
        renderChat();
        updateOnlineUsers();
        setTimeout(() => {
            let btn = document.getElementById('sendMsgBtn');
            if(btn) btn.onclick = sendMessage;
            let inputChat = document.getElementById('chatInput');
            if(inputChat) inputChat.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
        }, 50);
        // atualizar a cada 3 segundos (simula rede social)
        let interval = setInterval(() => { if(document.getElementById('chatMessages')) { renderChat(); updateOnlineUsers(); } else clearInterval(interval); }, 2000);
    }

    // JOGOS
    function openMines() {
        let html = `<div><h3>CAMPO MINADO</h3><div id="minesDiv"></div><button id="newMine" class="game-btn">NOVO</button></div>`;
        let win = createWindow("CAMPO MINADO", html, 400, 450);
        let size=8, mines=10, board, revealed;
        function initGame() {
            board = Array(size).fill().map(()=>Array(size).fill(0));
            revealed = Array(size).fill().map(()=>Array(size).fill(false));
            let minePos=[];
            while(minePos.length<mines){ let r=Math.floor(Math.random()*size),c=Math.floor(Math.random()*size); if(!minePos.some(m=>m[0]===r && m[1]===c)) minePos.push([r,c]); }
            for(let [r,c] of minePos) board[r][c]='M';
            for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(board[r][c]!=='M'){ let cnt=0; for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ let nr=r+dr,nc=c+dc; if(nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc]==='M') cnt++; } board[r][c]=cnt; }
            render();
        }
        function render(){
            let cont=document.getElementById('minesDiv'); if(!cont)return;
            cont.style.display='grid'; cont.style.gridTemplateColumns=`repeat(${size},35px)`;
            cont.innerHTML='';
            for(let i=0;i<size;i++) for(let j=0;j<size;j++){
                let cell=document.createElement('div'); cell.className='mine-cell';
                cell.style.background=revealed[i][j]?'#5a8a5a':'#3a5a3a';
                if(revealed[i][j]) cell.innerText=board[i][j]==='M'?'💣':(board[i][j]||'');
                cell.onclick=()=>{ if(board[i][j]==='M'){ alert('💥 EXPLODIU!'); initGame(); } else { revealed[i][j]=true; render(); } };
                cont.appendChild(cell);
            }
        }
        initGame();
        document.getElementById('newMine')?.addEventListener('click',()=>initGame());
    }

    function openNaval() {
        let html = `<div><h3>BATALHA NAVAL</h3><div id="navalDiv" style="display:inline-grid;gap:2px;"></div><button id="resetNav" class="game-btn">NOVO</button></div>`;
        let win = createWindow("BATALHA NAVAL", html, 420, 450);
        let size=8, hits=Array(8).fill().map(()=>Array(8).fill(false)), ships=[[0,0],[2,3],[5,5],[7,1]];
        function renderNav(){
            let cont=document.getElementById('navalDiv'); if(!cont)return;
            cont.style.gridTemplateColumns=`repeat(${size},35px)`;
            cont.innerHTML='';
            for(let i=0;i<size;i++) for(let j=0;j<size;j++){
                let cell=document.createElement('div'); cell.style.width='35px'; cell.style.height='35px'; cell.style.background=hits[i][j]?'#8a6a4a':'#3a6a4a'; cell.style.border='1px solid #6a9a6a'; cell.style.textAlign='center';
                cell.innerText=hits[i][j]?(ships.some(s=>s[0]===i && s[1]===j)?'💥':'❌'):'~';
                cell.onclick=()=>{ if(!hits[i][j]){ hits[i][j]=true; renderNav(); } };
                cont.appendChild(cell);
            }
        }
        renderNav();
        document.getElementById('resetNav')?.addEventListener('click',()=>{ hits=Array(8).fill().map(()=>Array(8).fill(false)); renderNav(); });
    }

    function openSnake() {
        let html = `<div><h3>JOGO DA COBRA</h3><div id="snakeGrid" class="snake-grid"></div><button id="startSnakeBtn" class="game-btn">INICIAR</button><p>Score: <span id="snakeScore">0</span></p></div>`;
        let win = createWindow("SNAKE", html, 450, 480);
        let snakeBody=[[10,10]], dir="RIGHT", food=[15,15], gameOn=false, score=0, interval;
        function buildGrid(){
            let grid=document.getElementById('snakeGrid'); if(!grid)return;
            grid.innerHTML='';
            for(let i=0;i<20;i++) for(let j=0;j<20;j++){
                let cell=document.createElement('div'); cell.className='snake-cell';
                if(snakeBody.some(s=>s[0]===i && s[1]===j)) cell.classList.add('snake');
                if(food[0]===i && food[1]===j) cell.classList.add('food');
                grid.appendChild(cell);
            }
        }
        function update(){
            if(!gameOn) return;
            let head=snakeBody[0], newHead=[...head];
            if(dir==='RIGHT') newHead[1]++; if(dir==='LEFT') newHead[1]--; if(dir==='UP') newHead[0]--; if(dir==='DOWN') newHead[0]++;
            if(newHead[0]<0||newHead[0]>=20||newHead[1]<0||newHead[1]>=20||snakeBody.some(s=>s[0]===newHead[0]&&s[1]===newHead[1])){ gameOn=false; clearInterval(interval); alert("GAME OVER!"); return; }
            snakeBody.unshift(newHead);
            if(newHead[0]===food[0] && newHead[1]===food[1]){ score++; document.getElementById('snakeScore').innerText=score; food=[Math.floor(Math.random()*20),Math.floor(Math.random()*20)]; } else snakeBody.pop();
            buildGrid();
        }
        document.getElementById('startSnakeBtn')?.addEventListener('click',()=>{ if(interval)clearInterval(interval); snakeBody=[[10,10]]; dir="RIGHT"; score=0; food=[15,15]; gameOn=true; document.getElementById('snakeScore').innerText='0'; buildGrid(); interval=setInterval(update,150); window.addEventListener('keydown',(e)=>{ if(e.key==='ArrowRight') dir='RIGHT'; else if(e.key==='ArrowLeft') dir='LEFT'; else if(e.key==='ArrowUp') dir='UP'; else if(e.key==='ArrowDown') dir='DOWN'; }); });
        buildGrid();
    }

    function openDino() {
        let html = `<div><h3>DINO RUN</h3><div id="dinoArea" style="height:150px;background:#2a4a2a;position:relative;margin:10px;"><div id="dino" style="position:absolute;bottom:0;left:40px;width:25px;height:25px;background:#aaffaa;"></div><div id="obs" style="position:absolute;bottom:0;right:0;width:18px;height:25px;background:#aa8a6a;"></div></div><p>Score: <span id="dinoScore">0</span></p><button id="startDinoBtn" class="game-btn">CORRER</button></div>`;
        let win = createWindow("DINO RUN", html, 480, 350);
        let dinoRun=false, score=0, obsX=300, jump=false, yPos=0, loop;
        function gameLoop(){
            if(!dinoRun) return;
            obsX-=6; if(obsX<0){ obsX=280; score++; document.getElementById('dinoScore').innerText=score; }
            document.getElementById('obs').style.right = (300-obsX)+'px';
            if(!jump && yPos===0 && Math.abs(obsX-40)<25){ dinoRun=false; clearInterval(loop); alert("FIM!"); }
            if(jump){ yPos-=1.5; if(yPos<=-25){ jump=false; yPos=0; } document.getElementById('dino').style.bottom = yPos+20 + 'px'; }
            else document.getElementById('dino').style.bottom = '0px';
        }
        document.getElementById('startDinoBtn')?.addEventListener('click',()=>{ if(loop)clearInterval(loop); obsX=300; score=0; dinoRun=true; jump=false; yPos=0; document.getElementById('dinoScore').innerText='0'; loop=setInterval(gameLoop,30); window.addEventListener('keydown',(e)=>{ if(e.code==='Space' && dinoRun && !jump){ jump=true; yPos=20; } }); });
    }

    function openFiles() {
        let html = `<div><h3>📁 ARQUIVOS DO SISTEMA</h3><div class="folder-item" id="showUsers">🔐 USUÁRIOS CADASTRADOS</div><div class="folder-item" id="showLogs">📜 LOGS DE ACESSO</div><div id="fileView"></div></div>`;
        let win = createWindow("EXPLORADOR", html, 480, 400);
        setTimeout(()=>{
            document.getElementById('showUsers').onclick=()=> document.getElementById('fileView').innerHTML=`<pre>${JSON.stringify(usersDB,null,2)}</pre><button id="addUserBtn" class="game-btn">NOVO USUÁRIO</button>`;
            document.getElementById('showLogs').onclick=()=> document.getElementById('fileView').innerHTML=`<pre>Último login: ${localStorage.getItem('last_login')||'Nenhum'}</pre>`;
        },50);
    }

    // LOGIN
    document.getElementById('loginBtn').onclick = () => {
        let user = document.getElementById('loginUser').value.trim();
        let pass = document.getElementById('loginPass').value;
        if(usersDB[user] && usersDB[user] === pass) {
            currentUser = user;
            localStorage.setItem('last_login', new Date().toLocaleString());
            initDesktop();
        } else document.getElementById('loginError').innerText = "ACESSO NEGADO!";
    };
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
</script>
</body>
